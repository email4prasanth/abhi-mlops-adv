# Deploy Stagging model (Train + Evaluate + Register + staging)
name: Deploy mlops model

on:
  push:
    branches:
      - CICD

env:
  ENV_NAME: staging
  AWS_REGION: us-east-1
  ECR_REGISTRY: 544238486182.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mlops-app/staging

jobs:
  mlflow-deploy:
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Up Tag
      run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependency
      run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

    - name: Run DVC pipeline
      env:
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        dvc repro

    - name: Run unit test
      env:
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        python -m unittest tests/model_test.py

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR Repository if not exists
      run: |
        aws ecr describe-repositories \
          --repository-names ${{ env.ECR_REPOSITORY }} \
          --region ${{ env.AWS_REGION }} \
        || \
        aws ecr create-repository \
          --repository-name ${{ env.ECR_REPOSITORY }} \
          --region ${{ env.AWS_REGION }}

    - name: Build Docker Image
      run: |
        docker build -t mlops-app:${{ env.IMAGE_TAG }} .

    - name: Tag Docker Image
      run: |
        docker tag mlops-app:${{ env.IMAGE_TAG }} \
        ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

    - name: Push Docker Image to ECR
      run: |
        docker push \
        ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: SSH into server and deploy
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF

        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin \
        ${{ env.ECR_REGISTRY }}

        docker pull \
        ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        docker stop mlops-container || true
        docker rm mlops-container || true

        docker run -d \
          --name mlops-container \
          -e MODEL_ALIAS=staging \
          -p 8080:8080 \
          ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        docker system prune -f
        EOF
